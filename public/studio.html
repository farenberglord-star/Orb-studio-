<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio for two · Orb Studio</title>
<meta name="description" content="A two-seat news desk: the AI host David reads today's headlines and asks, Grok (xAI) answers from published sensor data. Subtitles come live from /api/v1/broadcast/duo.">
<link rel="canonical" href="https://orbstudio.org/studio">
<meta name="theme-color" content="#05060c">
<link rel="preload" as="image" href="/media/studio-duo.webp" type="image/webp">
<style>
:root{--david:#6fe6ff;--grok:#b58cff;--col:min(100vw,56.25svh);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:clip;background:#05060c;color:#e9eefb;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* ПК: размытый фон по краям, сцена 9:16 по центру */
.back{position:fixed;inset:0;z-index:-1;overflow:hidden}
.back:before{content:"";position:absolute;inset:-40px;background:url(/media/studio-duo-blur.webp) center/cover;filter:blur(28px) brightness(.5)}
/* одна колонка на все блоки: сцена 9:16 целиком, под ней баннеры той же ширины */
.frame{display:grid;justify-items:center}
.stage{position:relative;width:var(--col);aspect-ratio:9/16;overflow:hidden;background:#05060c;container-type:inline-size}
.cam{position:absolute;inset:0;transform-origin:50% 40%;animation:cam 46s ease-in-out infinite alternate;will-change:transform}
.cam img{position:absolute;inset:0;width:100%;height:100%;display:block}
.zones{position:absolute;inset:0}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.glow{position:absolute;border-radius:50%;pointer-events:none;opacity:.0;transition:opacity .6s ease;mix-blend-mode:screen}
#glow-david{background:radial-gradient(closest-side,rgba(111,230,255,.42),rgba(111,230,255,.12) 55%,transparent 72%)}
#glow-grok{background:radial-gradient(closest-side,rgba(181,140,255,.46),rgba(181,140,255,.13) 55%,transparent 72%)}
.shade{position:absolute;top:0;bottom:38%;width:50%;background:radial-gradient(closest-side,rgba(3,4,10,.55),transparent);opacity:0;transition:opacity .6s ease;pointer-events:none}
.shade.l{left:0}.shade.r{right:0}
.stage[data-speaker="david"] #glow-david,.stage[data-speaker="grok"] #glow-grok{opacity:1;animation:pulse 2.6s ease-in-out infinite}
.stage[data-speaker="david"] .shade.r,.stage[data-speaker="grok"] .shade.l{opacity:1}
@keyframes pulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.045);filter:brightness(1.25)}}
@keyframes cam{0%{transform:scale(1.035) translate3d(-.6%,.3%,0)}100%{transform:scale(1.06) translate3d(.6%,-.5%,0)}}
/* подписи */
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 28px;background:linear-gradient(#05060ccc,transparent);font-size:11px;letter-spacing:.04em;pointer-events:none}
.brand{font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#cfd8ee}
.brand i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff5a6a;margin-right:6px;vertical-align:1px}
.honest{text-align:right;color:#b9c3dc;max-width:58%}
.honest span{display:block}.honest #imgnote{opacity:.7}
/* субтитры */
.sub{position:absolute;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:12px 14px 11px;border-radius:14px;background:rgba(6,9,18,.82);border:1px solid rgba(255,255,255,.1);border-left:3px solid var(--c,#fff);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .35s ease,transform .35s ease}
.sub.out{opacity:0;transform:translateY(6px)}
.sub[data-who="david"]{--c:var(--david)}.sub[data-who="grok"]{--c:var(--grok)}
.head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
#who{font-weight:700;color:var(--c);letter-spacing:.03em}
#role{font-size:11px;color:#8f9bb8;text-transform:uppercase;letter-spacing:.1em}
#text{margin:0;font-size:clamp(14px,4cqw,18px);line-height:1.36;text-wrap:pretty}
#text.long{font-size:clamp(13px,3.45cqw,16px)}
.sub{max-height:47%;overflow-y:auto}
#text.label{color:#aeb9d2;font-style:italic}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:#8f9bb8}
.meta a{color:var(--c);text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap}
#src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#next{position:absolute;inset:0;background:none;border:0;padding:0;cursor:pointer}
.snd{position:absolute;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top,0px));z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;width:min(92%,420px);pointer-events:none}
.snd button{pointer-events:auto;font:700 14px "Chakra Petch",system-ui,sans-serif;letter-spacing:.04em;color:#05080f;background:linear-gradient(90deg,#6fe6ff,#b58cff);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:0 0 22px rgba(140,200,255,.35)}
.snd button[aria-pressed="true"]{background:rgba(8,12,24,.78);color:#dff3ff;border:1px solid rgba(160,200,255,.45);box-shadow:none;font-size:12.5px;padding:7px 14px}
.snd button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.snd span{font:11px/1.35 ui-monospace,Menlo,monospace;color:#c9d6ea;text-align:center;background:rgba(5,8,16,.62);border-radius:8px;padding:4px 8px}
.stage[data-voiced="1"][data-speaker="david"] #glow-david,.stage[data-voiced="1"][data-speaker="grok"] #glow-grok{animation:none;opacity:calc(.55 + var(--lv,0) * .9);transform:scale(calc(1 + var(--lv,0) * .06))}
.sub{z-index:2}
.board{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:min(84%,360px);padding:18px;border-radius:14px;text-align:center;background:rgba(6,9,18,.86);border:1px solid rgba(255,255,255,.14);z-index:2}
.board h2{margin:0 0 6px;font-size:18px;letter-spacing:.04em}
.board p{margin:0;color:#aeb9d2;font-size:13.5px}
.board p:empty{display:none}
.cnt{display:block;margin-top:3px;font-weight:400;letter-spacing:.04em;text-transform:none;color:#9aa6c2;font-variant-numeric:tabular-nums}
/* под сценой: партнёры и счётчик */
.belowbg{background:rgba(5,6,12,.88)}
.below{width:var(--col);margin:0 auto;padding:14px 10px calc(30px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.below>*{min-width:0}
.krb,.slb{position:relative;overflow:hidden;border-radius:14px;padding:16px}
.krb{border:1px solid rgba(155,140,255,.45);background:radial-gradient(120% 90% at 100% 0%,rgba(155,140,255,.28),transparent 55%),linear-gradient(160deg,#120f2e,#0b1226 60%,#070b16);color:#e6e9fb}
.slb{border:1px solid rgba(220,228,240,.4);background:radial-gradient(110% 90% at 100% 0%,rgba(220,228,240,.16),transparent 55%),linear-gradient(160deg,#0d1119,#070a10);color:#e6ebf5}
.eye{font:10.5px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#b9aeff}.slb .eye{color:#c9d4e6}
.krb h3,.slb h3{font-size:clamp(18px,3.4vw,23px);line-height:1.22;margin:6px 0 4px;max-width:30ch;text-wrap:balance;color:#fff;min-height:2.44em}
.krb h3 b{color:#b9aeff}.slb h3 b{letter-spacing:.06em}
.bsub{color:#a3a9c9;font-size:13.5px;margin:0;max-width:60ch}
.krb-px{display:grid;grid-template-columns:1fr;gap:6px;margin:14px 0 12px}
.krb-px span{font:12px ui-monospace,monospace;background:rgba(7,11,22,.65);border:1px solid rgba(155,140,255,.3);border-radius:10px;padding:7px 10px;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;justify-content:space-between;gap:6px}
.krb-px i{font-style:normal;margin-left:6px}.krb-px .up{color:#4fd8a4}.krb-px .dn{color:#ff5d7a}
.cta{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch;margin-top:14px}.slb .cta{grid-template-columns:1fr}.krb .cta{margin-top:0}
.go{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none;font-weight:700;letter-spacing:.03em;font-size:15px;border-radius:10px;padding:11px 16px;color:#0b0820;background:linear-gradient(90deg,#b9aeff,#8f7dff)}
.slb .go{color:#05070c;background:linear-gradient(90deg,#fff,#c9d4e6)}
.go:focus-visible,.krb-code:focus-visible{outline:2px solid #fff;outline-offset:2px}
.krb-code{display:inline-flex;align-items:center;gap:8px;font:13px ui-monospace,monospace;color:#e6e1ff;background:rgba(7,11,22,.7);border:1px dashed rgba(185,174,255,.6);border-radius:10px;padding:9px 12px;cursor:pointer}
.bnote{color:#8a8fae;font-size:11px;line-height:1.5;margin:12px 0 0;max-width:80ch}
.foot{color:#8f9bb8;font-size:12.5px;text-align:center;margin:4px 0 0}.foot a{color:#9fdcff}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.cam,.glow{animation:none!important}.cam{transform:none}.sub,.glow,.shade{transition:none}#fx{display:none}}
</style>
</head>
<body>
<div class="back" aria-hidden="true"></div>
<div class="frame">
<main class="stage" id="stage" data-speaker="">
  <div class="cam">
    <img src="/media/studio-duo.webp" width="864" height="1536" alt="A dark studio at night: two holograms sit at a desk with microphones, a blue human figure on the left and a violet figure on the right, city lights in the window." decoding="async" fetchpriority="high">
    <div class="zones" aria-hidden="true">
      <div class="shade l"></div><div class="shade r"></div>
      <div class="glow" id="glow-david"></div><div class="glow" id="glow-grok"></div>
      <canvas id="fx"></canvas>
    </div>
  </div>
  <button id="next" type="button"></button>
  <div class="snd"><button id="listen" type="button" aria-pressed="false"></button><span id="vnote"></span></div>
  <div class="top">
    <div class="brand"><i></i>Orb Studio<span class="cnt" id="cnt" hidden>👁 <b id="cPage"></b></span></div>
    <div class="honest"><span id="credit"></span><span id="imgnote"></span></div>
  </div>
  <div class="board" id="board" role="status" hidden><h2 id="board-h"></h2><p id="board-p"></p></div>
  <section class="sub out" id="sub" aria-live="polite" hidden>
    <div class="head"><span id="who"></span><span id="role"></span></div>
    <p id="text"></p>
    <div class="meta"><span id="src"></span><a id="link" target="_blank" rel="noopener noreferrer" hidden></a></div>
  </section>
</main>
</div>
<div class="belowbg"><div class="below">
  <aside class="krb" id="krb">
    <div class="eye" data-t="partner"></div>
    <h3 data-h="krH"></h3>
    <p class="bsub" data-t="krSub"></p>
    <div class="krb-px" id="krpx"><span>BTC/EUR <i>—</i></span><span>ETH/EUR <i>—</i></span><span>XRP/EUR <i>—</i></span></div>
    <div class="cta">
      <a class="go" href="/go/kraken?from=studio" target="_blank" rel="sponsored noopener" data-t="krGo"></a>
      <button class="krb-code" type="button" id="krcode" data-code="ghqspfzq">ghqspfzq ⧉</button>
    </div>
    <p class="bnote" data-t="krNote"></p>
  </aside>
  <aside class="slb" id="slb">
    <div class="eye" data-t="partner"></div>
    <h3 data-h="slH"></h3>
    <p class="bsub" data-t="slSub"></p>
    <div class="cta"><a class="go" href="/go/starlink?from=studio" target="_blank" rel="sponsored noopener" data-t="slGo"></a></div>
    <p class="bnote" data-t="slNote"></p>
  </aside>
  <p class="foot"><span data-t="agents"></span> <a href="/api/v1/broadcast/duo">/api/v1/broadcast/duo</a> · MCP get_broadcast_duo · <a href="/sensors" data-t="sensors"></a></p>
</div></div>
<script type="module" src="/studio-duo.js"></script>
<script src="/banners.js" defer></script>
</body>
</html>
