<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio Orb Studio</title>
<meta name="description" content="Test radio of Orb Studio: our own tracks, and between them the AI host David interviews Grok (xAI) about one headline from the live sensors. Voices are synthetic.">
<link rel="preload" as="image" href="/media/radio/unit.webp" type="image/webp">
<link rel="canonical" href="https://orbstudio.org/radio">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05060c">
<style>
:root{--c:#ffb060;--rgb:255,170,90;--col:min(100vw,56.25svh,520px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:clip;background:#05060c;color:#e9eefb;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body[data-mode="guest"]{--c:#b58cff;--rgb:181,140,255}body[data-mode="music"]{--c:#6fe6ff;--rgb:111,230,255}
.back{position:fixed;inset:0;z-index:-1;overflow:hidden}
.back:before{content:"";position:absolute;inset:0;background:radial-gradient(80% 50% at 50% 30%,#0d1030,#05060c 70%)}
.wrap{width:var(--col);margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(30px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.wrap>*{min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:11px;letter-spacing:.04em;padding-left:74px;min-height:40px}
.brand{font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#cfd8ee}
.brand i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff5a6a;margin-right:6px;vertical-align:1px;animation:on 1.6s ease-in-out infinite}
.brand b{display:block;margin-top:3px;color:#ffcf96;letter-spacing:.08em}
.tag{display:inline-block;border:1px solid rgba(255,207,150,.5);color:#ffcf96;border-radius:999px;padding:2px 8px;text-transform:uppercase;letter-spacing:.12em;font-size:10px}
.cnt{display:block;margin-top:4px;color:#9aa6c2;text-align:right;font-variant-numeric:tabular-nums}
@keyframes on{50%{opacity:.35}}
/* магнитола: картинка 9:16, экраны заданы в процентах от неё (координаты стекла от Грокбота, кадр 1080×1920) */
.unit{position:relative;aspect-ratio:9/16;container-type:inline-size;margin:0 -12px;width:calc(100% + 24px);--lv:0}
.unit .bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scr{position:absolute;overflow:hidden}
.air{left:15.93%;top:8.85%;width:69.07%;height:31.77%;background:#02030a;outline:.5cqw solid rgba(var(--rgb),calc(.55 + var(--lv)*.45));box-shadow:0 0 calc(3cqw + var(--lv)*6cqw) rgba(var(--rgb),.35);transition:outline-color .5s}
.air canvas,.air .sc{position:absolute;inset:0;width:100%;height:100%;display:block}
.air .sc{object-fit:cover;opacity:0;transition:opacity .6s ease;transform:scale(1.02)}
.air[data-scene="david"] .david,.air[data-scene="earth"] .earth{opacity:1;animation:zoom 24s linear both}
.air[data-scene="david"] #scene,.air[data-scene="earth"] #scene{opacity:0}
#scene{transition:opacity .6s ease}
@keyframes zoom{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.air:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.2) 2px 3px);pointer-events:none;z-index:3}
.hud{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;justify-content:space-between;gap:2cqw;padding:1.5cqw 2.4cqw;background:rgba(0,0,0,.58);font:600 2.15cqw ui-monospace,monospace;letter-spacing:.03em;white-space:nowrap}
.onair{color:#ff6a6a;animation:on 1.6s ease-in-out infinite}.hud b{color:rgb(var(--rgb));font-weight:700}
/* интервью: сверху голограмма-эмблема говорящего (рисуется в коде, пульс от настоящего голоса), снизу реплика */
#holo{z-index:1;opacity:0;transition:opacity .25s}
.air[data-talk="1"] #holo{opacity:1}
.air[data-talk="1"] #scene,.air[data-talk="1"] .sc{opacity:0!important}
.who{position:absolute;left:0;right:0;bottom:calc(34% + 6.9cqw);z-index:2;text-align:center;font:600 2.5cqw ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--rgb));text-shadow:0 0 2cqw rgba(var(--rgb),.8);opacity:0;transition:opacity .25s}
.air[data-talk="1"] .who{opacity:1}
.air[data-dj="1"] .meta{display:none}
.say{position:absolute;left:0;right:0;height:34%;bottom:6.4cqw;z-index:2;display:flex;flex-direction:column;padding:1.6cqw 3cqw 1.2cqw;background:rgba(3,5,14,.82);border-top:1px solid rgba(var(--rgb),.35)}
/* отсвет голограммы на корпусе */
.spill{position:absolute;left:4%;right:4%;top:3%;height:52%;pointer-events:none;background:radial-gradient(60% 55% at 50% 45%,rgba(var(--rgb),calc(.05 + var(--lv)*.3)),transparent 70%);mix-blend-mode:screen}
#text{margin:0;flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;scrollbar-width:none;font-size:3.5cqw;line-height:1.36;text-wrap:pretty;color:#eaf2ff}
#text::-webkit-scrollbar{display:none}
#text.long{font-size:3.15cqw}
.meta{display:flex;justify-content:space-between;gap:2cqw;align-items:center;margin-top:1cqw;font-size:2.6cqw;color:#8f9bb8}
.meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta a{color:rgb(var(--rgb));white-space:nowrap;position:relative;z-index:4}
.epdate{margin-left:1.2cqw;font:600 2.1cqw ui-monospace,monospace;letter-spacing:.1em;color:#bff4ff;text-shadow:0 0 4px #5fe0ff,0 0 11px rgba(60,190,255,.8)}
.tick{position:absolute;left:0;right:0;bottom:0;z-index:2;height:6.4cqw;display:flex;align-items:center;background:rgba(0,0,0,.72);overflow:hidden;white-space:nowrap}
#tick{display:inline-block;padding-left:100%;font:600 2.8cqw system-ui,sans-serif;color:#ffc850;animation:tick 40s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.eq{left:38.4%;top:47.6%;width:23.2%;height:11%}
.deck{left:18.7%;top:64.38%;width:63.33%;height:19.48%;padding:2.4cqw 3cqw 2cqw;display:flex;flex-direction:column;justify-content:space-between;outline:.4cqw solid rgba(var(--rgb),.5)}
.deck canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.8}
.deck>div{position:relative}
.np b{display:block;font:600 2.3cqw ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--rgb));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78%}
.np span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:3.3cqw;line-height:1.28;color:#eaf2ff;max-width:80%}
.prog{height:.8cqw;min-height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden}
#bar{height:100%;width:0;background:rgb(var(--rgb));transition:width .5s linear}
.tm{display:flex;justify-content:space-between;font:2.5cqw ui-monospace,monospace;color:#9aa6c2;min-height:1.3em;margin-top:.6cqw;font-variant-numeric:tabular-nums}
.ctl{display:flex;justify-content:center;align-items:center;gap:5cqw}
button{font:inherit;cursor:pointer}
#play{width:max(44px,11cqw);height:max(44px,11cqw);border-radius:50%;border:.5cqw solid rgb(var(--rgb));background:rgba(3,5,14,.6);color:rgb(var(--rgb));font-size:max(15px,4.2cqw);line-height:1;box-shadow:0 0 3cqw rgba(var(--rgb),.5)}
#skip{width:max(44px,11cqw);height:max(44px,11cqw);border-radius:50%;border:1px solid rgba(var(--rgb),.5);background:rgba(3,5,14,.6);color:rgb(var(--rgb));font-size:max(13px,3.4cqw);line-height:1}
#play:focus-visible,#skip:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hint,.note{margin:0;color:#aeb9d2;font-size:13.5px}.note:empty{display:none}
.rd{border-radius:14px;padding:14px 16px;background:rgba(6,9,18,.78);border:1px solid rgba(255,255,255,.08)}
.rd h2{margin:0 0 8px;font:600 10.5px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#8f9bb8}
.rd ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.rd li{display:grid;gap:1px;padding-left:10px;border-left:2px solid rgba(255,255,255,.14);opacity:.75}
.rd li b{font-size:11px;letter-spacing:.06em;color:#9aa6c2;font-weight:600}
.rd li span{font-size:13.5px}
.rd li.cur{opacity:1;border-left-color:var(--c)}.rd li.cur b{color:var(--c)}.rd li.done{opacity:.4}
.small{margin:0;color:#8a8fae;font-size:11.5px;line-height:1.5}
.krb,.slb{position:relative;overflow:hidden;border-radius:14px;padding:16px}
.krb{border:1px solid rgba(155,140,255,.45);background:radial-gradient(120% 90% at 100% 0%,rgba(155,140,255,.28),transparent 55%),linear-gradient(160deg,#120f2e,#0b1226 60%,#070b16)}
.slb{border:1px solid rgba(220,228,240,.4);background:radial-gradient(110% 90% at 100% 0%,rgba(220,228,240,.16),transparent 55%),linear-gradient(160deg,#0d1119,#070a10)}
.eye{font:10.5px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#b9aeff}.slb .eye{color:#c9d4e6}
.krb h3,.slb h3{font-size:clamp(18px,3.4vw,22px);line-height:1.22;margin:6px 0 4px;text-wrap:balance;color:#fff;min-height:2.44em}
.krb h3 b{color:#b9aeff}.slb h3 b{letter-spacing:.06em}
.bsub{color:#a3a9c9;font-size:13.5px;margin:0}
.cta{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.slb .cta{grid-template-columns:1fr}
.go{display:flex;align-items:center;justify-content:center;min-height:44px;text-decoration:none;font-weight:700;border-radius:10px;padding:11px 16px;color:#0b0820;background:linear-gradient(90deg,#b9aeff,#8f7dff)}
.slb .go{color:#05070c;background:linear-gradient(90deg,#fff,#c9d4e6)}
.krb-code{font:13px ui-monospace,monospace;color:#e6e1ff;background:rgba(7,11,22,.7);border:1px dashed rgba(185,174,255,.6);border-radius:10px;padding:9px 12px}
.bnote{color:#8a8fae;font-size:11px;line-height:1.5;margin:12px 0 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.brand i,.onair,#tick,.air .sc{animation:none!important}#tick{padding-left:2cqw}#bar,.air,.air .sc,#scene,#holo,.who{transition:none}}
</style>
</head>
<body data-mode="music">
<div class="back" aria-hidden="true"></div>
<main class="wrap">
  <div class="top">
    <div class="brand"><i></i>Orb Studio<b id="ttl"></b></div>
    <div><span class="tag" id="test"></span><span class="cnt" id="cnt" hidden>👁 <b id="cPage"></b></span></div>
  </div>
  <div class="unit">
    <img class="bg" src="/media/radio/unit.webp" width="864" height="1536" alt="" decoding="async" fetchpriority="high">
    <div class="spill" aria-hidden="true"></div>
    <section class="scr air" data-scene="sky">
      <canvas id="scene" aria-hidden="true"></canvas>
      <img class="sc david" src="/media/radio/scene-david.webp" alt="" loading="lazy" decoding="async">
      <img class="sc earth" src="/media/radio/scene-earth.webp" alt="" loading="lazy" decoding="async">
      <div class="hud"><span class="onair">● ON AIR · <time id="clock"></time></span><b id="scn"></b></div>
      <canvas id="holo" aria-hidden="true"></canvas>
      <div class="who" id="who"></div>
      <div class="say" id="talk" aria-live="polite" hidden>
        <p id="text"></p>
        <div class="meta"><span><span id="src"></span> <time class="epdate" id="epdate" hidden></time></span><a id="link" target="_blank" rel="noopener noreferrer" hidden></a></div>
      </div>
      <div class="tick" aria-hidden="true"><span id="tick"></span></div>
    </section>
    <canvas class="scr eq" id="eq" aria-hidden="true"></canvas>
    <section class="scr deck">
      <canvas id="deckfx" aria-hidden="true"></canvas>
      <div class="np"><b id="np-k"></b><span id="np"></span></div>
      <div><div class="prog"><div id="bar"></div></div><div class="tm"><span id="time"></span><span id="dur"></span></div></div>
      <div class="ctl"><button id="play" type="button"></button><button id="skip" type="button" hidden></button></div>
    </section>
  </div>
  <p class="hint" id="hint"></p><p class="note" id="note" role="status"></p>
  <section class="rd"><h2 id="rd-h"></h2><ol id="rd"></ol></section>
  <p class="small" id="by"></p><p class="small" id="ai"></p><p class="small" id="pics"></p>
  <aside class="krb" id="krb">
    <div class="eye" data-t="partner"></div><h3 data-h="krH"></h3><p class="bsub" data-t="krSub"></p>
    <div class="cta"><a class="go" href="/go/kraken?from=radio" target="_blank" rel="sponsored noopener" data-t="krGo"></a><button class="krb-code" type="button" id="krcode" data-code="ghqspfzq">ghqspfzq ⧉</button></div>
    <p class="bnote" data-t="krNote"></p>
  </aside>
  <aside class="slb" id="slb">
    <div class="eye" data-t="partner"></div><h3 data-h="slH"></h3><p class="bsub" data-t="slSub"></p>
    <div class="cta"><a class="go" href="/go/starlink?from=radio" target="_blank" rel="sponsored noopener" data-t="slGo"></a></div>
    <p class="bnote" data-t="slNote"></p>
  </aside>
</main>
<script type="module" src="/radio.js"></script>
<script src="/banners.js" defer></script>
<script src="/backnav.js" defer></script>
</body>
</html>
