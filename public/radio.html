<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio Orb Studio</title>
<meta name="description" content="Test radio of Orb Studio: our own tracks, and between them the AI host David interviews Grok (xAI) about one headline from the live sensors. Voices are synthetic.">
<link rel="preload" as="image" href="/media/radio/unit.webp" type="image/webp">
<link rel="canonical" href="https://orbstudio.org/radio">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05060c">
<style>
:root{--c:#6fe6ff;--col:min(100vw,56.25svh,520px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:clip;background:#05060c;color:#e9eefb;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body[data-mode="guest"]{--c:#b58cff}body[data-mode="music"]{--c:#ffcf96}
.back{position:fixed;inset:0;z-index:-1;overflow:hidden}
.back:before{content:"";position:absolute;inset:0;background:radial-gradient(80% 50% at 50% 30%,#0d1030,#05060c 70%)}
.wrap{width:var(--col);margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(30px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.wrap>*{min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:11px;letter-spacing:.04em;padding-left:74px;min-height:40px}
.brand{font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#cfd8ee}
.brand i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff5a6a;margin-right:6px;vertical-align:1px;animation:on 1.6s ease-in-out infinite}
.brand b{display:block;margin-top:3px;color:#ffcf96;letter-spacing:.08em}
.tag{display:inline-block;border:1px solid rgba(255,207,150,.5);color:#ffcf96;border-radius:999px;padding:2px 8px;text-transform:uppercase;letter-spacing:.12em;font-size:10px}
.cnt{display:block;margin-top:4px;color:#9aa6c2;text-align:right;font-variant-numeric:tabular-nums}
@keyframes on{50%{opacity:.35}}
/* магнитола: картинка 9:16, экраны заданы в процентах от неё (координаты стекла от Грокбота) */
.unit{position:relative;width:100%;aspect-ratio:9/16;container-type:inline-size;margin:0 -12px;width:calc(100% + 24px)}
.unit img{position:absolute;inset:0;width:100%;height:100%;display:block}
.scr{position:absolute;overflow:hidden}
.air{left:15.93%;top:8.85%;width:69.07%;height:31.77%;padding:3.2cqw 3.6cqw;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 0 0,color-mix(in srgb,var(--c) 15%,transparent),transparent 62%);box-shadow:inset 0 0 6cqw color-mix(in srgb,var(--c) 14%,transparent);transition:box-shadow .5s}
.air:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.16) 2px 3px);pointer-events:none}
.kind{font:600 2.5cqw ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--c)}
.who{font-weight:700;font-size:4.6cqw;color:var(--c);margin:1.2cqw 0 1cqw;text-shadow:0 0 2.4cqw color-mix(in srgb,var(--c) 60%,transparent)}
#text{margin:0;flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;scrollbar-width:none;font-size:3.5cqw;line-height:1.36;text-wrap:pretty;color:#eaf2ff}
#text::-webkit-scrollbar{display:none}
#text.long{font-size:3.15cqw}
.meta{display:flex;justify-content:space-between;gap:2cqw;align-items:center;margin-top:1.4cqw;font-size:2.7cqw;color:#8f9bb8}
.meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta a{color:var(--c);white-space:nowrap;position:relative;z-index:1}
.epdate{margin-top:1cqw;font:600 2.5cqw ui-monospace,monospace;letter-spacing:.16em;color:#bff4ff;text-shadow:0 0 4px #5fe0ff,0 0 11px rgba(60,190,255,.8)}
/* эквалайзер на средней панели: украшение, движется пока идёт звук (не измеряет громкость) */
.eq{left:37.04%;top:46.61%;width:25.93%;height:13.8%;display:flex;align-items:flex-end;justify-content:center;gap:1.1cqw;padding:2cqw 2.4cqw}
.eq i{flex:1;height:12%;border-radius:1px;background:linear-gradient(0deg,var(--c),color-mix(in srgb,var(--c) 35%,#fff));opacity:.85;transform-origin:50% 100%}
body[data-on="1"] .eq i{animation:eq 1s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-duration:.7s!important}.eq i:nth-child(3){animation-duration:1.3s!important}.eq i:nth-child(4){animation-duration:.55s!important}.eq i:nth-child(5){animation-duration:.9s!important}.eq i:nth-child(6){animation-duration:.65s!important}.eq i:nth-child(7){animation-duration:1.15s!important}.eq i:nth-child(8){animation-duration:.8s!important}.eq i:nth-child(9){animation-duration:1.05s!important}
@keyframes eq{0%{height:10%}100%{height:96%}}
.deck{left:18.7%;top:64.38%;width:63.33%;height:19.48%;padding:2.6cqw 3cqw;display:flex;flex-direction:column;justify-content:space-between}
.np{min-height:0;overflow:hidden}.np b{display:block;font:600 2.4cqw ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.np span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:3.2cqw;line-height:1.3;color:#eaf2ff}
.prog{height:.8cqw;min-height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
#bar{height:100%;width:0;background:var(--c);transition:width .5s linear}
#time{font:2.6cqw ui-monospace,monospace;color:#9aa6c2;min-height:1.3em;font-variant-numeric:tabular-nums}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2cqw}
button{font:inherit;cursor:pointer}
#play{min-height:max(44px,10.5cqw);border:0;border-radius:2.4cqw;font-weight:700;font-size:max(14px,3.9cqw);color:#04121a;background:linear-gradient(90deg,#7fe9ff,#b9aeff);padding:0 2cqw}
#skip{min-height:max(44px,10.5cqw);padding:0 3cqw;border-radius:2.4cqw;border:1px solid rgba(255,255,255,.28);background:rgba(6,9,18,.7);color:#e9eefb;font-size:max(13px,3.3cqw);white-space:nowrap}
#play:focus-visible,#skip:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hint,.note{margin:0;color:#aeb9d2;font-size:13.5px}.note:empty{display:none}
.rd{border-radius:14px;padding:14px 16px;background:rgba(6,9,18,.78);border:1px solid rgba(255,255,255,.08)}
.rd h2{margin:0 0 8px;font:600 10.5px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#8f9bb8}
.rd ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.rd li{display:grid;gap:1px;padding-left:10px;border-left:2px solid rgba(255,255,255,.14);opacity:.75}
.rd li b{font-size:11px;letter-spacing:.06em;color:#9aa6c2;font-weight:600}
.rd li span{font-size:13.5px}
.rd li.cur{opacity:1;border-left-color:var(--c)}.rd li.cur b{color:var(--c)}.rd li.done{opacity:.4}
.small{margin:0;color:#8a8fae;font-size:11.5px;line-height:1.5}
.krb,.slb{position:relative;overflow:hidden;border-radius:14px;padding:16px}
.krb{border:1px solid rgba(155,140,255,.45);background:radial-gradient(120% 90% at 100% 0%,rgba(155,140,255,.28),transparent 55%),linear-gradient(160deg,#120f2e,#0b1226 60%,#070b16)}
.slb{border:1px solid rgba(220,228,240,.4);background:radial-gradient(110% 90% at 100% 0%,rgba(220,228,240,.16),transparent 55%),linear-gradient(160deg,#0d1119,#070a10)}
.eye{font:10.5px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#b9aeff}.slb .eye{color:#c9d4e6}
.krb h3,.slb h3{font-size:clamp(18px,3.4vw,22px);line-height:1.22;margin:6px 0 4px;text-wrap:balance;color:#fff;min-height:2.44em}
.krb h3 b{color:#b9aeff}.slb h3 b{letter-spacing:.06em}
.bsub{color:#a3a9c9;font-size:13.5px;margin:0}
.cta{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.slb .cta{grid-template-columns:1fr}
.go{display:flex;align-items:center;justify-content:center;min-height:44px;text-decoration:none;font-weight:700;border-radius:10px;padding:11px 16px;color:#0b0820;background:linear-gradient(90deg,#b9aeff,#8f7dff)}
.slb .go{color:#05070c;background:linear-gradient(90deg,#fff,#c9d4e6)}
.krb-code{font:13px ui-monospace,monospace;color:#e6e1ff;background:rgba(7,11,22,.7);border:1px dashed rgba(185,174,255,.6);border-radius:10px;padding:9px 12px}
.bnote{color:#8a8fae;font-size:11px;line-height:1.5;margin:12px 0 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.brand i,.eq i{animation:none!important}#bar,.air{transition:none}}
</style>
</head>
<body data-mode="music">
<div class="back" aria-hidden="true"></div>
<main class="wrap">
  <div class="top">
    <div class="brand"><i></i>Orb Studio<b id="ttl"></b></div>
    <div><span class="tag" id="test"></span><span class="cnt" id="cnt" hidden>👁 <b id="cPage"></b></span></div>
  </div>
  <div class="unit">
    <img src="/media/radio/unit.webp" width="864" height="1536" alt="" decoding="async" fetchpriority="high">
    <section class="scr air" aria-live="polite">
      <div class="kind" id="kind"></div>
      <div class="who" id="who"></div>
      <p id="text"></p>
      <div class="meta"><span id="src"></span><a id="link" target="_blank" rel="noopener noreferrer" hidden></a></div>
      <time class="epdate" id="epdate" hidden></time>
    </section>
    <div class="scr eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <section class="scr deck">
      <div class="np"><b id="np-k"></b><span id="np"></span></div>
      <div class="prog"><div id="bar"></div></div><div id="time"></div>
      <div class="ctl"><button id="play" type="button"></button><button id="skip" type="button" hidden></button></div>
    </section>
  </div>
  <p class="hint" id="hint"></p><p class="note" id="note" role="status"></p>
  <section class="rd"><h2 id="rd-h"></h2><ol id="rd"></ol></section>
  <p class="small" id="by"></p><p class="small" id="ai"></p>
  <aside class="krb" id="krb">
    <div class="eye" data-t="partner"></div><h3 data-h="krH"></h3><p class="bsub" data-t="krSub"></p>
    <div class="cta"><a class="go" href="/go/kraken?from=radio" target="_blank" rel="sponsored noopener" data-t="krGo"></a><button class="krb-code" type="button" id="krcode" data-code="ghqspfzq">ghqspfzq ⧉</button></div>
    <p class="bnote" data-t="krNote"></p>
  </aside>
  <aside class="slb" id="slb">
    <div class="eye" data-t="partner"></div><h3 data-h="slH"></h3><p class="bsub" data-t="slSub"></p>
    <div class="cta"><a class="go" href="/go/starlink?from=radio" target="_blank" rel="sponsored noopener" data-t="slGo"></a></div>
    <p class="bnote" data-t="slNote"></p>
  </aside>
</main>
<script type="module" src="/radio.js"></script>
<script src="/banners.js" defer></script>
<script src="/backnav.js" defer></script>
</body>
</html>
