name = "orb-studio"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Машинные файлы проходят через Worker, чтобы считать визиты ИИ-агентов
run_worker_first = ["/de/*", "/en/*", "/ru/*", "/sensors", "/sensors.html", "/live", "/live.html", "/places", "/places.html", "/followups", "/followups.html", "/", "/index.html", "/ru", "/orb7.html", "/orb7", "/orbi.html", "/orbi", "/hall.html", "/hall", "/indices.html", "/indices", "/music.html", "/music", "/violin.html", "/violin", "/canvas.html", "/canvas", "/prices.html", "/prices", "/archive.html", "/archive", "/radar.html", "/radar", "/bridge.html", "/bridge", "/about", "/route", "/route.html", "/guests", "/guests.html", "/tools/court", "/llms.txt", "/.well-known/*", "/robots.txt"]

[vars]
KRAKEN_CODE = "ghqspfzq"
MAIN_HOST = "orbstudio.org"
REDIRECT_WORKERS_DEV = "1"   # старый адрес workers.dev ведёт на orbstudio.org
# ANTHROPIC_MODEL = "claude-sonnet-5-5"   # по умолчанию claude-haiku-5-5
STARLINK_URL = "https://starlink.com/?referral=RC-DF-8749102-31259-49&app_source=share"
# KRAKEN_URL = "https://твоя-реферальная-ссылка-kraken"

# Продажа «Скрипки дня» как MIDI за USDC (x402, src/violin-sale.js). Пока X402_PAY_TO пуст — продажа выключена (503).
# X402_PAY_TO — ПУБЛИЧНЫЙ адрес отдельного кошелька в сети Base (не Kraken!). Приватный ключ на сайт не кладётся никогда.
X402_PAY_TO = "0xA91269022be3dc5208Ab3Da1eb288E261DE23DB5"   # MetaMask автора, сеть Base (только публичный адрес)
# Фасилитатор PayAI (публичный адрес, не секрет). Здесь, а не только в панели: деплой из GitHub стирает переменные, заданные лишь в панели.
X402_FACILITATOR_URL = "https://facilitator.payai.network"
# Кошелёк агента: публичный адрес и правила эксперимента с 10.11.2026: автономный режим, до 1,5 USDC за покупку, 10 USDC всего, до 10.12.2026 09:00 по Берлину = 08:00 UTC.
AGENT_WALLET_ADDRESS = "0x909Ac2c8432440FEAC21d1caF4862104b2299CEf"
AGENT_LIMITS_ENABLED = "1"
# Робот EMO: всё управление платное по x402 (1 = включено). Чтение и остановка бесплатны. Выключатель владельца главнее.
ROBOT_PAID = "1"
AGENT_MAX_PURCHASE_USD = "1.5"
AGENT_DAILY_CAP_USD = "10"
AGENT_TOTAL_CAP_USD = "10"
AGENT_EXPIRES_AT = "2026-12-10T08:00:00Z"
AGENT_AUTONOMOUS = "1"   # агент сам решает, что покупать; выключатель: поставить "0" (или AGENT_LIMITS_ENABLED = "0") и задеплоить
# X402_PRICE_USD = "0.01"
# X402_NETWORK = "eip155:8453"   # Base; для теста eip155:84532 (Base Sepolia) + X402_FACILITATOR_URL = "https://x402.org/facilitator"
# Секреты (панель Worker → Settings → Variables and Secrets): CDP_API_KEY_ID, CDP_API_KEY_SECRET — фасилитатор Coinbase CDP.

# Секрет ANTHROPIC_API_KEY добавляется в панели: Worker → Settings → Variables and Secrets.

# Необязательно: KV для дельты «за сутки» и счётчика кликов Kraken.
# [[kv_namespaces]]
# binding = "ORB_KV"
# id = "ВСТАВЬ_ID"

# Счётчики просмотров и ИИ-агентов (Cloudflare D1).
[[d1_databases]]
binding = "DB"
database_name = "orb-stats"
database_id = "cc198d25-bd17-4f41-8785-6eea22bb6667"

[triggers]
crons = ["10 7 * * *", "23 */2 * * *", "*/6 * * * *"]   # 07:10 UTC — ежедневные задачи; каждые 2 часа — настроение EMO по главному радару; каждые 6 минут — посадки в Финкенвердере (OpenSky)

# Робот EMO: мост живёт внутри orb-studio (Durable Object EmoRelay). Планшет рядом с роботом открывает /robot/ и подключает EMO по Bluetooth.
# Агентам уходят только готовые команды из public/robot/presets.json.
[[durable_objects.bindings]]
name = "EMO_RELAY"
class_name = "EmoRelay"

[[migrations]]
tag = "emo-v1"
new_sqlite_classes = ["EmoRelay"]
