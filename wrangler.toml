name = "orb-studio"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Машинные файлы проходят через Worker, чтобы считать визиты ИИ-агентов
run_worker_first = ["/de/*", "/en/*", "/ru/*", "/sensors", "/sensors.html", "/live", "/live.html", "/places", "/places.html", "/followups", "/followups.html", "/", "/index.html", "/ru", "/orb7.html", "/orb7", "/orbi.html", "/orbi", "/hall.html", "/hall", "/indices.html", "/indices", "/music.html", "/music", "/violin.html", "/violin", "/canvas.html", "/canvas", "/prices.html", "/prices", "/archive.html", "/archive", "/radar.html", "/radar", "/bridge.html", "/bridge", "/llms.txt", "/.well-known/*", "/robots.txt"]

[vars]
KRAKEN_CODE = "ghqspfzq"
MAIN_HOST = "orbstudio.org"
REDIRECT_WORKERS_DEV = "1"   # старый адрес workers.dev ведёт на orbstudio.org
# ANTHROPIC_MODEL = "claude-sonnet-5-5"   # по умолчанию claude-haiku-5-5
STARLINK_URL = "https://starlink.com/?referral=RC-DF-8749102-31259-49&app_source=share"
# KRAKEN_URL = "https://твоя-реферальная-ссылка-kraken"

# Продажа «Скрипки дня» как MIDI за USDC (x402, src/violin-sale.js). Пока X402_PAY_TO пуст — продажа выключена (503).
# X402_PAY_TO — ПУБЛИЧНЫЙ адрес отдельного кошелька в сети Base (не Kraken!). Приватный ключ на сайт не кладётся никогда.
X402_PAY_TO = "0xA91269022be3dc5208Ab3Da1eb288E261DE23DB5"   # MetaMask автора, сеть Base (только публичный адрес)
# X402_PRICE_USD = "0.01"
# X402_NETWORK = "eip155:8453"   # Base; для теста eip155:84532 (Base Sepolia) + X402_FACILITATOR_URL = "https://x402.org/facilitator"
# Секреты (панель Worker → Settings → Variables and Secrets): CDP_API_KEY_ID, CDP_API_KEY_SECRET — фасилитатор Coinbase CDP.

# Секрет ANTHROPIC_API_KEY добавляется в панели: Worker → Settings → Variables and Secrets.

# Необязательно: KV для дельты «за сутки» и счётчика кликов Kraken.
# [[kv_namespaces]]
# binding = "ORB_KV"
# id = "ВСТАВЬ_ID"

# Счётчики просмотров и ИИ-агентов (Cloudflare D1).
[[d1_databases]]
binding = "DB"
database_name = "orb-stats"
database_id = "cc198d25-bd17-4f41-8785-6eea22bb6667"

[triggers]
crons = ["10 7 * * *"]

# Робот EMO: сайт передаёт агентам только безопасные команды из списка в воркер emo-relay (связь с роботом через планшет по Bluetooth).
# Секрет EMO_SECRET (тот же, что у emo-relay) — в Cloudflare → orb-studio → Settings → Variables and Secrets, тип Secret.
[[services]]
binding = "EMO"
service = "emo-relay"
